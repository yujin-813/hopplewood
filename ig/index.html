<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>호플우드</title>
  <!-- 프로필의 한 링크에서 기기에 맞는 스토어로 이동한다. 데스크톱은 소개 페이지로 간다. -->
  <script>
    const landing='../start.html?utm_source=instagram&utm_medium=profile&utm_campaign=free3_20261109';
    const ios='https://apps.apple.com/app/apple-store/id6813280139?pt=125211719&ct=free3_20261109_instagram&mt=8';
    const android='https://play.google.com/store/apps/details?id=com.hopplewood.app&referrer=utm_source%3Dinstagram%26utm_medium%3Dprofile%26utm_campaign%3Dfree3_20261109';
    const ua=navigator.userAgent||'';
    const ipadLike=navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1;
    location.replace(/Android/i.test(ua)?android:(/iPhone|iPad|iPod/i.test(ua)||ipadLike)?ios:landing);
  </script>
</head>
<body><p>호플우드 앱 설치 페이지로 이동 중입니다. <a href="../start.html?utm_source=instagram&amp;utm_medium=profile&amp;utm_campaign=free3_20261109">직접 열기</a></p></body>
</html>
